name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract project ZIP
        run: unzip -q MLToolkitTraining-cloud-build.zip

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p MLToolkitTraining assembleDebug --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: MLToolkitTraining-debug-apk
          path: MLToolkitTraining/app/build/outputs/apk/debug/app-debug.apk
