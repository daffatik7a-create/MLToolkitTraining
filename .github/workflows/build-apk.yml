name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract project
        run: |
          ls -la
          unzip -o -q MLToolkitTraining-cloud-build.zip || echo "ZIP sudah di-extract"
          ls -la MLToolkitTraining/
          ls -la MLToolkitTraining/app/ || true

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd MLToolkitTraining
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: MLToolkitTraining-debug-apk
          path: MLToolkitTraining/app/build/outputs/apk/debug/*.apk
