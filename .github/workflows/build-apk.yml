name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract and find project
        run: |
          ls -la
          unzip -o -q MLToolkitTraining-cloud-build.zip
          ls -la
          find . -name "gradlew" -type f
          chmod +x $(find . -name "gradlew" -type f)

      - uses: gradle/actions/setup-gradle@v5

      - name: Build APK
        run: |
          GRADLE_DIR=$(dirname $(find . -name "gradlew" -type f | head -n 1))
          echo "Building in $GRADLE_DIR"
          cd $GRADLE_DIR
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: MLToolkitTraining-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
