name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract project
        run: |
          unzip -o -q MLToolkitTraining-cloud-build.zip

      - name: Fix JVM Target to 17
        run: |
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle.kts" | head -n 1))
          echo "Fixing in $PROJECT_DIR"
          # ganti semua 1.8 jadi 17
          sed -i 's/VERSION_1_8/VERSION_17/g' $PROJECT_DIR/app/build.gradle.kts || true
          sed -i 's/JvmTarget.JVM_1_8/JvmTarget.JVM_17/g' $PROJECT_DIR/app/build.gradle.kts || true
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' $PROJECT_DIR/app/build.gradle.kts || true
          sed -i 's/"1.8"/"17"/g' $PROJECT_DIR/app/build.gradle.kts || true
          sed -i 's/1_8/17/g' $PROJECT_DIR/app/build.gradle.kts || true
          cat $PROJECT_DIR/app/build.gradle.kts | grep -A2 -B2 "jvmTarget\|sourceCompat\|targetCompat\|VERSION"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle.kts" | head -n 1))
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: MLToolkitTraining-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
